<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iShell</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #15151F;
      color-scheme: dark;
    }
    html[data-theme="light"], html[data-theme="light"] body {
      background: #EFF1F5;
      color-scheme: light;
    }
  </style>
  <script>
    // Apply persisted state synchronously before CSS is loaded to prevent flash.
    try {
      const _t = localStorage.getItem('theme');
      if (_t) document.documentElement.setAttribute('data-theme', _t);
      if (localStorage.getItem('sidebar-collapsed') === '1') {
        document.documentElement.classList.add('sidebar-collapsed');
      }
    } catch {}
  </script>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>

<!-- ── App Layout ── -->
<div class="app-layout" id="app">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">⌨</div>
      <div>
        <div class="app-name">iShell</div>
        <div class="app-version"></div>
      </div>
    </div>

    <div class="sidebar-search">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input class="input" id="session-search" placeholder="Search profiles…" data-i18n-placeholder="app.searchPlaceholder" />
      </div>
    </div>

    <div class="sidebar-list" id="session-list">
      <!-- populated by JS -->
    </div>

    <div class="sidebar-footer">
      <button class="btn btn-primary btn-sm" id="btn-new-session" data-i18n="app.newProfile">+ New Profile</button>
      <div style="display:flex;gap:4px;">
        <button class="btn btn-ghost btn-icon" id="btn-settings" title="Settings" data-i18n-title="common.settings">⚙️</button>
      </div>
    </div>
  </aside>

  <!-- Main area -->
  <div class="main-area" id="main-area">

    <!-- Unified toolbar -->
    <div class="unified-toolbar" id="unified-toolbar">
      <button class="sidebar-toggle" id="btn-toggle-sidebar" title="Toggle sidebar" data-i18n-title="app.toggleSidebar">☰</button>
      <div class="toolbar-vdiv"></div>
      <div class="tabs-scroll" id="tabs-scroll"></div>
      <div style="flex:1;"></div>
      <button class="btn btn-ghost btn-sm" id="btn-new-instance" title="New app instance" data-i18n-title="app.newInstanceTitle" data-i18n="app.newInstanceLabel">+ Instance</button>
      <div class="toolbar-vdiv"></div>
      <div class="topbar-actions" id="topbar-actions" style="display:none;">
        <button class="btn btn-ghost btn-sm" id="btn-search-term" title="Find in terminal" data-i18n-title="app.findInTerminal">🔍</button>
        <button class="btn btn-ghost btn-sm" id="btn-ai-cmdbar" title="AI Command  Alt+K" data-i18n-title="app.aiCmdBarTitle" style="display:none;">✨</button>
        <button class="btn btn-ghost btn-sm" id="btn-quick-command" title="Show quick commands" data-i18n-title="app.showQuickCommands">⚡</button>
        <button class="btn btn-ghost btn-sm" id="btn-sftp" style="color:var(--blue);" title="Open SFTP" data-i18n-title="app.openSftpTitle">📁 SFTP</button>
        <button class="btn btn-ghost btn-sm" id="btn-port-forward" title="Port Forwarding" data-i18n-title="portForward.title" style="display:none;">⇄</button>
        <div class="toolbar-vdiv"></div>
        <button class="btn btn-ghost btn-sm" id="btn-fullscreen" title="Fullscreen  Alt+Enter" data-i18n-title="welcome.kbdFullscreen">⛶</button>
      </div>
      <div class="toolbar-vdiv" id="ai-toolbar-vdiv" style="display:none;"></div>
      <button class="btn btn-ghost btn-sm" id="btn-toggle-ai" title="AI Assistant" data-i18n-title="app.aiSidebarTitle" style="display:none;">✨ AI</button>
      <div class="toolbar-vdiv" id="disconnect-vdiv" style="display:none;"></div>
      <button class="btn btn-danger btn-sm" id="btn-disconnect" data-i18n="app.disconnect" style="display:none;">Disconnect</button>
    </div>

    <!-- Content panels (only one visible at a time) -->

    <!-- Welcome screen -->
    <div class="panel" id="panel-welcome">
      <div class="empty-state">
        <div class="empty-icon">⌨️</div>
        <div class="empty-title" data-i18n="welcome.title">Welcome to iShell</div>
        <div class="empty-sub" data-i18n-html="welcome.subtitleHtml">Select a profile from the sidebar or click <strong>+ New Profile</strong>.</div>
        <div class="kbd-hints">
          <div class="kbd-hint"><kbd id="kbd-switch-tab">Alt+1…9</kbd> <span data-i18n="welcome.kbdSwitchTab">Switch tab</span></div>
          <div class="kbd-hint"><kbd>Alt+Enter</kbd> <span data-i18n="welcome.kbdFullscreen">Fullscreen</span></div>
          <div class="kbd-hint"><kbd>⌘,</kbd> <span data-i18n="welcome.kbdSettings">Settings</span></div>
        </div>
      </div>
    </div>

    <!-- Terminal tab content is created per tab by main.js so each tab owns
         its terminal, find bar, status bar, and AI sidebar instance. -->
    <div class="panel" id="panel-terminal" style="display:none;"></div>

    <!-- SFTP panel -->
    <div class="panel" id="panel-sftp" style="display:none;">
      <!-- content injected by sftp.js -->
    </div>

    <!-- Settings panel -->
    <div class="panel" id="panel-settings" style="display:none;">
      <!-- content injected by settings.js -->
    </div>

  </div><!-- /main-area -->
</div><!-- /app -->

<!-- ── Modals ── -->
<div id="modal-root"></div>

<!-- Toast -->
<div id="kb-toast"></div>

<!-- Host key warning dialog -->
<div class="overlay" id="hostkey-overlay" style="display:none;">
  <div class="modal" style="width:460px;">
    <div class="modal-header">
      <span class="modal-title" data-i18n="hostkey.title">⚠ Unknown Host Key</span>
    </div>
    <div class="modal-body">
      <p style="color:var(--text-secondary);font-size:13px;margin-bottom:10px;" data-i18n="hostkey.body">
        The server's host key has not been verified before. Make sure the fingerprint below matches what you expect.
      </p>
      <div style="font-family:var(--font-mono);font-size:12px;background:var(--bg-primary);padding:10px 14px;border-radius:6px;word-break:break-all;color:var(--text-secondary);" id="hostkey-fp"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-danger btn-sm" id="hostkey-reject" data-i18n="hostkey.reject">✕ Reject</button>
      <button class="btn btn-secondary" id="hostkey-once" data-i18n="hostkey.trustOnce">Trust Once</button>
      <button class="btn btn-primary" id="hostkey-always" data-i18n="hostkey.alwaysTrust">Always Trust</button>
    </div>
  </div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
